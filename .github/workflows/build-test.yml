name: Build test (Windows)

# When does the workflow run?
on:
  workflow_dispatch:
  push:
    branches: [ ci/release-automation ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+']

# Values used in several steps.
env:
  QT_VS_TOOLS_VSIX_URL: https://download.qt.io/official_releases/vsaddin/3.5.0/qt-vsaddin-msvc2022-x64-3.5.0.vsix

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      # 1. Clone the repository into the VM
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. On a tag: make sure the tag matches the version in version.h, escam.pro and escam_setup.vdproj
      - name: Check version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          function Get-Number($file, $pattern) {
            (Select-String $file -Pattern $pattern).Matches[0].Groups[1].Value
          }
          $versionH = @('MAJOR', 'MINOR', 'PATCH') | ForEach-Object { Get-Number version.h "#define VERSION_$($_)_ESCAM\s+(\d+)" }
          $escamPro = @('MAJOR', 'MINOR', 'BUILD') | ForEach-Object { Get-Number escam/escam.pro "VERSION_$($_)_QT\s*=\s*(\d+)" }
          $vdproj   = Get-Number escam_setup/escam_setup.vdproj '"ProductVersion" = "8:([\d.]+)"'
          $found = [ordered]@{
            'version.h'          = $versionH -join '.'
            'escam.pro'          = $escamPro -join '.'
            'escam_setup.vdproj' = $vdproj
          }
          $found.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
          $wrong = $found.GetEnumerator() | Where-Object { $_.Value -ne $tag }
          if ($wrong) { throw "Tag $tag does not match: $(($wrong | ForEach-Object { $_.Key }) -join ', ')" }

      # 3. Find out which Qt version the project expects 
      - name: Read Qt version from escam.vcxproj
        id: qt 
        shell: pwsh
        run: |
          $name = (Select-String escam/escam.vcxproj -Pattern '<QtInstall>(.+?)</QtInstall>').Matches[0].Groups[1].Value
          $version, $arch = $name -split '_', 2      # "6.12.0" and "msvc2022_64"
          Write-Host "Qt: $name"
          "name=$name"       >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "arch=$arch"       >> $env:GITHUB_OUTPUT

      # 4. Restore Qt from cache if this version was downloaded before
      - name: Cache Qt 
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt-${{ steps.qt.outputs.name }}-charts

      # 5. Download Qt with aqtinstall (only on cache miss)
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@c3ab4ca8d9f7f3b624c924e6c3b2ef664a8d4188"
          python -m aqt install-qt windows desktop ${{ steps.qt.outputs.version }} win64_${{ steps.qt.outputs.arch }} -m qtcharts --outputdir C:\Qt

      # 6. Register the Qt version under the name used in escam.vcxproj
      - name: Register Qt version for QtMsBuild
        shell: pwsh
        run: |
          $key = "HKCU:\Software\QtProject\QtVsTools\Versions\${{ steps.qt.outputs.name }}"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name InstallDir -Value "C:\Qt\${{ steps.qt.outputs.version }}\${{ steps.qt.outputs.arch }}"

      # 7. Extract QtMsBuild (the MSBuild rules for /moc/uic/rcc) from the Qt VS Tools package
      - name: Provide QtMsBuild
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\qtvstools.zip"
          Invoke-WebRequest $env:QT_VS_TOOLS_VSIX_URL -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\qtvstools"
          $qtMsBuild = "$env:RUNNER_TEMP\qtvstools\QtMsBuild"
          if (-not (Test-Path "$qtMsBuild\qt.targets")) {
            Get-ChildItem "$env:RUNNER_TEMP\qtvstools" | Format-Table Name
            throw "qt.targets not found in $qtMsBuild"
          }
          "QtMsBuild=$qtMsBuild" >> $env:GITHUB_ENV

      # 8. Find the Visual Studio installation
      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          "VS_PATH=$vs" >> $env:GITHUB_ENV

      # 9. Without this, building .vdproj from the command line fails with HRESULT 8000000A
      - name: Disable out-of-process build for vdproj
        shell: pwsh
        run: |
          $tool = Get-ChildItem "$env:VS_PATH\Common7\IDE" -Recurse -Filter DisableOutOfProcBuild.exe | Select-Object -First 1
          if (-not $tool) { throw "DisableOutOfProcBuild.exe not found" }
          Push-Location $tool.DirectoryName
          & $tool.FullName
          Pop-Location

      # 10. makeall.ps1 calls devenv.com and MSBuild.exe by name, so put them on the PATH
      - name: Add devenv and MSBuild to PATH
        shell: pwsh
        run: |
          "$env:VS_PATH\Common7\IDE" >> $env:GITHUB_PATH
          "$env:VS_PATH\MSBuild\Current\Bin" >> $env:GITHUB_PATH

      # 11. Build all configurations and create the ZIPs in Release/, same as locally
      - name: Build all configurations (makeall.ps1)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true    # abort if devenv or MSBuild returns an error
          .\makeall.ps1 -buildAction Rebuild

      # 12. Keep the ZIPs for download
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Release/*.zip