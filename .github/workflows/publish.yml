name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to archive (e.g. 4.25.0)
        required: true

jobs:
  pages:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    
    steps:
      # 1. Clone the Pages repository with the deploy key
      - name: Checkout Pages repository 
        uses: actions/checkout@v4
        with:
          repository: Entwicklungsburo-Stresing/Entwicklungsburo-Stresing.github.io
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      # 2. Tag the latest commit, unless the tag already exists
      - name: Tag Pages repository
        run: |
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null; then
            echo "Tag $TAG already exists in the Pages repository"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  nextcloud:
    needs: pages
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # 1. Download all files attached to the release and the "Source code (zip)"
      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --archive zip --dir files
          curl -fsSL -o "files/Entwicklungsburo-Stresing.github.io-$TAG.zip" \
            "$GITHUB_SERVER_URL/Entwicklungsburo-Stresing/Entwicklungsburo-Stresing.github.io/archive/refs/tags/$TAG.zip"
          ls -l files

      # 2. Create the version folder and upload all files via WebDAV
      - name: Upload to Nextcloud
        env:
          NC_USER: ${{ secrets.NEXTCLOUD_USER }}
          NC_PASSWORD: ${{ secrets.NEXTCLOUD_PASSWORD }}
        run: |
          folder="https://nextcloud.stresing.de/remote.php/dav/files/$NC_USER/Shared/Release/$TAG"

          # MKCOL creates the folder: 201 = created, 405 = already exists (e.g. on re-run)
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 -u "$NC_USER:$NC_PASSWORD" -X MKCOL "$folder")
          if [ "$code" != 201 ] && [ "$code" != 405 ]; then
            echo "Could not create $TAG folder: HTTP $code"
            exit 1
          fi

          for file in files/*; do
            echo "Uploading $(basename "$file")"
            curl -fsS --retry 3 -u "$NC_USER:$NC_PASSWORD" -T "$file" "$folder/$(basename "$file")"
          done

  # Open a pull request in stresing_python with the new ESLSCDLL builds
  python:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: Entwicklungsburo-Stresing/stresing_python

    steps:
      # 1. Short-lived token of the GitHub App, only for stresing_python
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: stresing_python

      # 2. Clone EBST_CAM at the tag with full history
      - name: Checkout EBST_CAM
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          path: ebst_cam

      # 3. Clone stresing_python with the app token, so we can push to it
      - name: Checkout stresing_python
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET }}
          token: ${{ steps.app-token.outputs.token }}
          path: stresing_python

      # 4. Windows DLL from the release, Linux .so from the artifacts of the release run
      - name: Download ESLSCDLL builds
        env: 
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ESLSCDLL-*.zip" --dir dll
          unzip -q dll/ESLSCDLL-*.zip -d dll || [ $? -eq 1 ]    # exit code 1 = only warnings

          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$TAG" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful release run found for $TAG"
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name linux-build --dir so

      # 5. Replace DLL and .so, set the version, turn "Unreleased" into the new version section
      - name: Update stresing_python
        working-directory: stresing_python
        run: |
          cp "../dll/ESLSCDLL-$TAG/Release/ESLSCDLL.dll" stresing/ESLSCDLL.dll
          cp ../so/ESLSCDLL/libESLSCDLL.so stresing/libESLSCDLL.so
          sed -i "s/^version = \".*\"/version = \"$TAG\"/" pyproject.toml

          awk -v v="$TAG" -v d="$(date +%F)" '
            function flush() {
              if (n > 0) printf "%s\n%s", h, buf
              h = ""; buf = ""; n = 0
            }
            /^## Unreleased/ {
              print "## Unreleased"
              print "### Added"; print "### Changed"; print "### Removed"; print "### Fixed"; print "### Deprecated"
              print ""; print ""
              print "## " v " - " d
              insec = 1; next
            }
            insec && /^## / { flush(); print ""; insec = 0 }
            insec && /^### / {
              flush(); h = $0
              if (h == "### Changed") { buf = "* Update ESLSCDLL to " v "\n"; n = 1 }
              next
            }
            insec && /^[[:space:]]*$/ { next }
            insec { buf = buf $0 "\n"; n++; next }
            { print }
            END { if (insec) flush() }
          ' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git diff --stat

         # 6. PR text: diff of the public headers since the previous version
      - name: Write pull request text
        run: |
          prev=$(awk -v v="$TAG" '
            $1 == "##" && $2 == v { found = 1; next }
            found && $1 == "##" && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $2; exit }
          ' ebst_cam/CHANGELOG.md)
          diff=$(git -C ebst_cam diff "$prev" "$TAG" -- ESLSCDLL/ESLSCDLL.h 'shared_src/*.h')
          {
            echo "Update ESLSCDLL to [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)."
            echo
            echo "Before merging, check if the interface changes below affect stresing_python (functions, structs, enums)."
            echo
            if [ -z "$diff" ]; then
              echo "No changes in \`ESLSCDLL.h\` or \`shared_src/*.h\` since $prev."
            else
              echo "Changes in \`ESLSCDLL.h\` and \`shared_src/*.h\` since $prev:"
              echo
              echo '```diff'
              echo "$diff" | head -c 60000
              echo
              echo '```'
            fi
          } > pr-body.md
          cat pr-body.md

      # 7. Commit as the app, push the branch and open the pull request
      - name: Create pull request
        working-directory: stresing_python
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # never touch an existing release branch, it may already contain manual changes
          if git ls-remote --exit-code --heads origin "release/$TAG" > /dev/null; then
            echo "Branch release/$TAG already exists, leaving it untouched"
            exit 0
          fi

          user_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"

          git switch -c "release/$TAG"
          git commit -am "chore: release version $TAG"
          git push origin "release/$TAG"

          gh pr create --repo "$TARGET" --base master --head "release/$TAG" \
            --title "chore: release version $TAG" --body-file ../pr-body.md

  # Open a pull request in lv64 with the new ESLSCDLL build
  lv64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: Entwicklungsburo-Stresing/lv64

    steps:
      # 1. Short-lived token of the GitHub App, only for lv64
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: lv64

      # 2. Clone EBST_CAM at the tag with full history (for the header diff)
      - name: Checkout EBST_CAM
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          path: ebst_cam

      # 3. Clone lv64 with the app token, so we can push to it
      - name: Checkout lv64
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET }}
          token: ${{ steps.app-token.outputs.token }}
          path: lv64

      # 4. Windows DLL from the release
      - name: Download ESLSCDLL build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ESLSCDLL-*.zip" --dir dll
          unzip -q dll/ESLSCDLL-*.zip -d dll || [ $? -eq 1 ]    # exit code 1 = only warnings

      # 5. Replace the DLL
      - name: Update lv64
        working-directory: lv64
        run: |
          cp "../dll/ESLSCDLL-$TAG/Release/ESLSCDLL.dll" board.vis/ESLSCDLL.dll
          git diff --stat

      # 6. PR text: diff of the public headers since the previous version
      - name: Write pull request text
        run: |
          prev=$(awk -v v="$TAG" '
            $1 == "##" && $2 == v { found = 1; next }
            found && $1 == "##" && $2 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $2; exit }
          ' ebst_cam/CHANGELOG.md)
          diff=$(git -C ebst_cam diff "$prev" "$TAG" -- ESLSCDLL/ESLSCDLL.h 'shared_src/*.h')
          {
            echo "Update ESLSCDLL to [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)."
            echo
            echo "Before merging, check if the interface changes below affect the LabVIEW VIs (functions, structs, enums)."
            echo
            if [ -z "$diff" ]; then
              echo "No changes in \`ESLSCDLL.h\` or \`shared_src/*.h\` since $prev."
            else
              echo "Changes in \`ESLSCDLL.h\` and \`shared_src/*.h\` since $prev:"
              echo
              echo '```diff'
              echo "$diff" | head -c 60000
              echo
              echo '```'
            fi
          } > pr-body.md
          cat pr-body.md

      # 7. Commit as the app, push the branch and open the pull request
      - name: Create pull request
        working-directory: lv64
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # never touch an existing release branch, it may already contain manual changes
          if git ls-remote --exit-code --heads origin "release/$TAG" > /dev/null; then
            echo "Branch release/$TAG already exists, leaving it untouched"
            exit 0
          fi

          user_id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$user_id+$APP_SLUG[bot]@users.noreply.github.com"

          git switch -c "release/$TAG"
          git commit -am "chore: release version $TAG"
          git push origin "release/$TAG"

          
          gh pr create --repo "$TARGET" --base master --head "release/$TAG" \
            --title "chore: release version $TAG" --body-file ../pr-body.md